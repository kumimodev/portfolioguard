name: PortfolioGuard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Unit tests
        run: python3 -m unittest -q

      - name: Working tree scan
        run: python3 portfolioguard.py .

      - name: History scan
        run: python3 portfolioguard.py . --history
