# Optional custom rules are additive to built-ins.
# [[rules]]
# name = "internal_identifier"
# pattern = "\\bINTERNAL-[0-9]{5}\\b"

# Optional scan limits (override built-in defaults when set).
# skip_dirs replaces the default skipped directory names entirely.
# Default skipped names: .git, node_modules, dist, build, .venv, venv, __pycache__, .idea, .vscode
# Example: keep most defaults but scan dist/ and build/ (e.g. before GitHub Pages publish):
# skip_dirs = [".git", "node_modules", ".venv", "venv", "__pycache__", ".idea", ".vscode"]
# max_file_bytes raises the size cap (default 1000000). CLI --max-bytes overrides this when set.
# max_file_bytes = 2000000

# Optional expected Git identities for --history mode.
# When set, every reachable commit whose author or committer email is outside
# this list is reported as unexpected-commit-identity (path shows field:email).
# name is optional. Repeat the table for each allowed identity.
# CLI --expect-email EMAIL (repeatable) merges with this list.
# [[expected_identities]]
# email = "dev@example.com"
# name = "Dev Example"
